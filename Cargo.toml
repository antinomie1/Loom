[package]
name = "loom"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
license = "BSD-2-Clause"
description = "A small, high-performance Linux init and service manager"
repository = "https://github.com/sclinuxdev/loom"

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml_edit = { version = "0.23", features = ["serde"] }

[profile.release]
opt-level = 3
codegen-units = 1
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
